# Original idea by @ISnackable. Thanks to him for handling the hardest parts!
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml

name: Build and Release uYouEnhanced

on:
  workflow_dispatch:
    inputs:
      build_ffmpeg:
        description: "Build FFmpegKit from source (cached; first run takes 30-90 min usually.)"
        default: true
        required: false
        type: boolean
      sdk_version:
        description: "iOS SDK Version"
        default: "26.5"
        required: true
        type: string
      ytplus_version:
        description: "YTPlus Version"
        default: "6.0"
        required: true
        type: string
      include_uyouenhanced:
        description: "Inject this repo's own tweak (uYouEnhanced) as well"
        default: false
        required: false
        type: boolean
      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube IPA"
        default: ""
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload IPA as artifact"
        default: false
        required: false
        type: boolean
      create_release:
        description: "Create a draft release"
        default: true
        required: false
        type: boolean
      enabled_tweaks:
        description: "Optional tweaks to include (space- or comma-separated ids)"
        default: "DontEatMyContent FLEXing Return-YouTube-Dislikes YTABConfig YouGroupSettings YTIcons YouLoop YouMute YouPiP YouQuality YouSlider YouSpeed YouTimeStamp YTHoldForSpeed YTVideoOverlay YTweaks YouTubeLegacy"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build uYouEnhanced
    # The iOS 27 SDK can only be consumed by the Xcode 27 toolchain: its .tbd
    # stubs list the arm64e.x1 target (unknown to Xcode 26's linker) and its
    # headers use attributes such as stack_protector_ignore (unknown to Xcode
    # 26's clang). The macos-latest images stop at Xcode 26, so iOS 27+ needs
    # the xcode-27 (preview) image. Everything older builds on macos-latest.
    runs-on: ${{ fromJSON(inputs.sdk_version) >= 27 && 'xcode-27' || 'macos-latest' }}
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          path: main
          ref: ${{ inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid dpkg make wget unzip jq pipx meson ninja gnu-sed autoconf automake libtool pkgconf pngquant

      - name: Set PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          # The source is part of the key: caches from the previous SDK repo
          # (aricloverALT/sdks) must not be reused.
          key: iOS-xybp888-${{ inputs.sdk_version }}-SDK

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git sdks
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout --quiet
          if [ ! -d "iPhoneOS${{ inputs.sdk_version }}.sdk" ]; then
            echo "error: iPhoneOS${{ inputs.sdk_version }}.sdk does not exist in xybp888/iOS-SDKs" >&2
            exit 1
          fi
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Theos Jailed
        uses: actions/checkout@v7
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed

      - name: Install Theos Jailed
        run: ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      # Two patches to theos-jailed's ipa.sh:
      #  * it builds inject_files=("$DYLIB" $INJECT_DYLIBS). With
      #    INCLUDE_UYOUENHANCED=0 that variable is empty, so relax the quoting to
      #    let an empty value contribute no entry (and no empty rpath string).
      #  * it copies every entry into Frameworks/ verbatim, so one stray
      #    directory in either list copies a whole tree into the app. Only
      #    regular files and bundle-like directories may pass; anything else is
      #    printed so the list that produced it can be fixed.
      - name: Patch theos-jailed injection list
        run: |
          FILE=theos-jailed/module/bin/ipa.sh
          sed -i '' 's/inject_files=("\$DYLIB" \$INJECT_DYLIBS)/inject_files=($DYLIB $INJECT_DYLIBS)/' "$FILE"
          sed -i '' 's|copy "\$file" "\$full_copy_path"$|[[ -f "$file" \|\| "$file" == *.framework \|\| "$file" == *.appex \|\| "$file" == *.bundle ]] \&\& copy "$file" "$full_copy_path" \|\| echo "SKIP non-file inject entry: $file"|' "$FILE"
          grep -n 'inject_files=\|full_copy_path' "$FILE"

      - name: Fix Theos broken pipe issue
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          find $THEOS -name "*.sh" -type f | while read -r SCRIPT; do
            if grep -q '| head' "$SCRIPT" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$SCRIPT" 2>/dev/null || true
              echo "Patched: $SCRIPT"
            fi
          done
          find $THEOS -name "*.mk" -type f | while read -r MK; do
            if grep -q '| head' "$MK" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$MK" 2>/dev/null || true
              echo "Patched: $MK"
            fi
          done
          echo "Broken pipe fixes applied"

      - name: Install cyan and tbd
        run: |
          pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          wget --quiet "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" -O /usr/local/bin/tbd
          chmod +x /usr/local/bin/tbd

      - name: Hash YT ipa url
        run: |
          URL_YT="$(jq -r '.inputs.decrypted_youtube_url' $GITHUB_EVENT_PATH)"
          echo ::add-mask::$URL_YT
          echo URL_YT=$URL_YT >> $GITHUB_ENV

      - name: Prepare YouTube iPA
        id: prepare_youtube
        run: |
          wget "$YOUTUBE_URL" --quiet -O main/YouTube.ipa
          cd main
          mv YouTube.ipa YouTube.zip
          unzip -q YouTube.zip
          youtube_version=$(defaults read "$(pwd)/Payload/YouTube.app/Info" CFBundleVersion)
          echo "YT_VERSION=$youtube_version" >> $GITHUB_ENV
          echo "youtube_version=${youtube_version}" >> $GITHUB_OUTPUT

        env:
          YOUTUBE_URL: ${{ env.URL_YT }}

      # Fails in seconds when the tweak selection cannot fit into the YouTube
      # binary's load-command area. Without it insert_dylib stalls for hours
      # instead of failing. See Tools/check-inject-budget.py.
      - name: Check injection budget
        run: |
          cd main
          python3 Tools/check-inject-budget.py \
            --binary Payload/YouTube.app/YouTube \
            --makefile Makefile \
            ${{ inputs.include_uyouenhanced && '--include-root' || '' }} \
            --tweaks "${{ inputs.enabled_tweaks }}"

      - name: Restore FFmpegKit cache
        id: ffmpeg_cache
        uses: actions/cache/restore@v6
        with:
          path: main/modules/ffmpeg
          key: ffmpegkit-${{ runner.os }}-${{ hashFiles('main/tools/fetch-ffmpegkit.sh') }}

      - name: Build FFmpegKit from source
        if: ${{ inputs.build_ffmpeg && steps.ffmpeg_cache.outputs.cache-hit != 'true' }}
        run: |
          cd main
          bash tools/fetch-ffmpegkit.sh

      - name: Save FFmpegKit cache
        if: ${{ inputs.build_ffmpeg && steps.ffmpeg_cache.outputs.cache-hit != 'true' && hashFiles('main/modules/ffmpeg/**') != '' }}
        uses: actions/cache/save@v6
        with:
          path: main/modules/ffmpeg
          key: ${{ steps.ffmpeg_cache.outputs.cache-primary-key }}

      - name: Build Package
        id: build_package
        run: |
          cd main
          make package THEOS_PACKAGE_SCHEME=rootless IPA=Payload/YouTube.app FINALPACKAGE=1 \
            SDK_VERSION="${{ inputs.sdk_version }}" \
            BUNDLE_ID="${{ inputs.bundle_id }}" \
            DISPLAY_NAME="${{ inputs.app_name }}" \
            YTPLUS_VERSION="${{ inputs.ytplus_version }}" \
            INCLUDE_UYOUENHANCED="${{ inputs.include_uyouenhanced && '1' || '0' }}" \
            ENABLED_TWEAKS="$(printf '%s' '${{ inputs.enabled_tweaks }}' | tr -s ', ' ' ')"
          echo "package=$(ls -t packages | head -n1)" >> $GITHUB_OUTPUT

        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Clone Open in YouTube (Safari Extension)
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/BillyCurtis/OpenYouTubeSafariExtension.git OpenYouTubeSafariExtension
          cd OpenYouTubeSafariExtension
          git sparse-checkout set --no-cone OpenYouTubeSafariExtension.appex
          git checkout --quiet
          mv *.appex ..

      - name: Inject Tweaks Into IPA
        run: |
          IPA_IN="main/packages/${{ steps.build_package.outputs.package }}"
          OUTNAME="YTPlus_${{ env.YT_VERSION }}_v${{ inputs.ytplus_version }}.ipa"
          # Only the freshly cloned Safari extension is injected here: the
          # theos-jailed build already put every compiled tweak into the app.
          # The .deb Theos writes is not injectable - the stager reuses Theos'
          # package staging directory, so that deb contains a full copy of the
          # app (13k files, 229 MB main binary) and handing it to cyan would
          # duplicate the whole app inside the IPA.
          cyan -i "$IPA_IN" -o "$OUTNAME" -uwef OpenYouTubeSafariExtension.appex \
            -n "${{ inputs.app_name }}" -b ${{ inputs.bundle_id }}

      - name: Strip Unresignable Extensions From Final IPA
        id: strip_ipa
        run: |
          set -euo pipefail

          OUTNAME="YTPlus_${{ env.YT_VERSION }}_v${{ inputs.ytplus_version }}.ipa"
          if [ ! -f "$OUTNAME" ]; then
            OUTNAME="$(basename "$(find . -maxdepth 3 -name 'YTPlus_*.ipa' -print -quit)")"
          fi
          echo "Final IPA: $OUTNAME"

          echo "--- .appex bundles contained in final IPA ---"
          unzip -Z1 "$OUTNAME" | grep '\.appex/' | sed 's|^\(.*\.appex\)/.*|\1|' | sort -u | tee appex_list.txt || true

          BAD="$(grep -v '/PlugIns/' appex_list.txt || true)"
          if [ -n "$BAD" ]; then
            echo "Removing unresignable extensions:"
            printf '%s\n' "$BAD"
            printf '%s\n' "$BAD" | while IFS= read -r d; do
              zip -q -d "$OUTNAME" "${d}/*" || true
            done
          else
            echo "All extensions are under PlugIns/ - OK for SideStore."
          fi
          SC_INFO_MATCHES="$(unzip -Z1 "$OUTNAME" | grep '/SC_Info/' || true)"
          if [ -n "$SC_INFO_MATCHES" ]; then
            echo "Removing files under SC_Info/ - OK for AltStore.:"
            printf '%s\n' "$SC_INFO_MATCHES"
            zip -q -d "$OUTNAME" "Payload/*/SC_Info/*" "Payload/*/SC_Info" || true
          fi
          mkdir -p main/packages
          cp -f "$OUTNAME" "main/packages/$OUTNAME"
          find main/packages -maxdepth 1 -name "*.ipa" ! -name "$OUTNAME" -delete || true
          echo "Final SideStore-compatible IPA: main/packages/$OUTNAME"
          echo "final_ipa=$OUTNAME" >> "$GITHUB_OUTPUT"

      - name: Register Alternate App Icons
        run: |
          set -euo pipefail
          IPA="main/packages/${{ steps.strip_ipa.outputs.final_ipa }}"
          rm -rf iconwork && mkdir -p iconwork/icons && cd iconwork
          unzip -q "../$IPA" "Payload/YouTube.app/Info.plist"
          PLIST="Payload/YouTube.app/Info.plist"
          RAW_ICON_SRC="../main/Localizations/uYouPlus.bundle/AppIcons"
          ICON_SRC="icons"
          for f in "$RAW_ICON_SRC"/*.png; do
            name="$(basename "$f")"
            pngquant --quality=80-95 --strip --skip-if-larger "$f" --output "$ICON_SRC/$name" >/dev/null 2>&1 || true
            [ -f "$ICON_SRC/$name" ] || cp -f "$f" "$ICON_SRC/$name"
          done
          PB=/usr/libexec/PlistBuddy
          BADICONS=0
          for f in "$ICON_SRC"/*.png; do
            SPEC="$(sips -g pixelWidth -g pixelHeight -g hasAlpha "$f" 2>/dev/null | awk '/pixelWidth/{w=$2} /pixelHeight/{h=$2} /hasAlpha/{a=$2} END{print w"x"h" alpha="a}')"
            case "$SPEC" in
              "1024x1024 alpha=no"*) ;;
              *) echo "::warning::$(basename "$f") is $SPEC"; BADICONS=1 ;;
            esac
          done
          if [ "$BADICONS" != 0 ]; then
            echo "::error::app icons must be 1024x1024 opaque PNGs or iOS rejects them with OSStatus -54"
            exit 1
          fi
          # Create intermediate dicts FIRST (PlistBuddy cannot nest-create).
          for ROOT in CFBundleIcons "CFBundleIcons~ipad"; do
            $PB -c "Add :$ROOT dict" "$PLIST" 2>/dev/null || true
            $PB -c "Add :$ROOT:CFBundleAlternateIcons dict" "$PLIST" 2>/dev/null || true
          done
          for f in "$ICON_SRC"/*.png; do
            NAME="$(basename "$f" .png)"
            cp -f "$f" "Payload/YouTube.app/$NAME.png"
            for ROOT in CFBundleIcons "CFBundleIcons~ipad"; do
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME dict" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconFiles array" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconFiles:0 string $NAME" "$PLIST" 2>/dev/null || true
            done
            echo "Registered alternate icon: $NAME"
          done
          $PB -c "Print :CFBundleIcons:CFBundleAlternateIcons" "$PLIST" | head -20
          zip -q "../$IPA" "$PLIST" Payload/YouTube.app/*.png
          cd .. && rm -rf iconwork
          echo "Alternate icons registered into $(basename "$IPA")"

      - name: Rebrand IPA Filename (3.0.4 -> 3.0.5)
        run: |
          set -euo pipefail
          cd main/packages
          OLD="${{ steps.strip_ipa.outputs.final_ipa }}"
          NEW="${OLD//3.0.4/3.0.5}"
          if [ "$OLD" != "$NEW" ] && [ -f "$OLD" ]; then
            mv "$OLD" "$NEW"
            echo "Renamed: $OLD -> $NEW"
          else
            echo "No 3.0.4 in filename or file missing: $OLD"
          fi
          echo "RENAMED_IPA=$NEW" >> "$GITHUB_ENV"

      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v7
        env:
          YTPLUS_VERSION: ${{ inputs.ytplus_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        with:
          name: YTPlus_${{ env.YOUTUBE_VERSION }}_${{ env.YTPLUS_VERSION }}
          path: ${{ github.workspace }}/main/packages/${{ env.RENAMED_IPA || steps.strip_ipa.outputs.final_ipa }}
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.create_release }}
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YTPLUS_VERSION: ${{ inputs.ytplus_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        with:
          tag_name: v${{ env.YOUTUBE_VERSION }}-${{ env.YTPLUS_VERSION }}-(${{ github.run_number }})
          name: v${{ env.YOUTUBE_VERSION }}-${{ env.YTPLUS_VERSION }}-(${{ github.run_number }})
          files: main/packages/*.ipa
          draft: true
